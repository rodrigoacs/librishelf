# Postgres só para desenvolvimento e testes locais (dados fictícios do seed).
#   docker compose -f docker-compose.local.yml up -d
#   docker compose -f docker-compose.local.yml down -v   ← apaga tudo
services:
  db:
    image: postgres:16-alpine
    container_name: librishelf-db-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: librishelf
      POSTGRES_PASSWORD: librishelf
      POSTGRES_DB: librishelf_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - librishelf-db-local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U librishelf -d librishelf_local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  librishelf-db-local:
