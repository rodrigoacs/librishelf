# Cabeçalhos de segurança de todas as respostas do frontend.
#
# Incluído em cada location do nginx.conf, e não só no server: um add_header
# dentro de um location apaga todos os herdados do nível de cima.
#
# Content-Security-Policy (pacote 36):
#   default-src 'self'          tudo do próprio domínio, salvo o que vem abaixo
#   script-src 'wasm-unsafe-eval'
#                               WebAssembly do leitor de código de barras
#                               (zxing). Nenhum script inline: o tema vem de
#                               /theme-boot.js
#   style-src 'self'            sem 'unsafe-inline': Vue e Chart.js mudam
#                               estilos pelo CSSOM (el.style), que a CSP não
#                               bloqueia
#   img-src data: blob:         capa padrão em SVG (data:), prévia da foto e
#                               da capa enviadas e a imagem da retrospectiva
#                               (blob:). Capas do Open Library passam pelo
#                               backend (/api/isbn/cover)
#   connect-src 'self'          API em /api e o .wasm (fetch)
#   form-action 'self'          o checkout vai ao Mercado Pago com
#                               location.assign, não com <form>
#   frame-ancestors 'none'      ninguém põe o Librishelf num iframe
#   report-uri                  violações vão para o backend (POST
#                               /csp-report) e, do pacote 37 em diante, para
#                               a lista de erros do Admin
#
# Por enquanto em Report-Only: o navegador avisa, mas não bloqueia. Depois de
# alguns dias sem violações legítimas no log, trocar o nome do cabeçalho para
# Content-Security-Policy (mesmo valor).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; report-uri /api/csp-report" always;

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Navegadores antigos, sem frame-ancestors
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
# Janela própria: outra aba aberta por link não consegue mexer nesta
add_header Cross-Origin-Opener-Policy "same-origin" always;
