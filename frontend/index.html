<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: no celular o app vai até as bordas e o CSS respeita
         o notch e a barra de gestos com env(safe-area-inset-*) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Librishelf</title>
    <meta name="description" content="Librishelf — organize sua biblioteca pessoal: cadastre livros, acompanhe o que já leu e encontre qualquer obra da sua coleção." />
    <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f0f3" media="(prefers-color-scheme: light)" />
    <!-- SVG nítido em qualquer tamanho; o .ico fica para navegadores antigos -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/bookshelf.png" />
    <!-- Instalar como app no celular (ícone na tela inicial, abre sem a barra do navegador) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Librishelf" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!--
      Prévia (WhatsApp, redes) e robots. Em /u/<usuário> e /u/<usuário>/lists/<id>
      o nginx processa os comandos SSI desta parte: pede ao backend as tags
      daquela biblioteca ou lista ($meta_rest vem do nginx.conf), que
      entram no lugar das genéricas abaixo; se o backend falhar, ficam as
      genéricas com noindex. Nas outras páginas os comandos SSI são só
      comentários e valem as tags genéricas (iguais a defaultTags() no
      metaService do backend).
    -->
    <!--# include virtual="/__meta/u/$lib_user$meta_rest" set="meta_head" wait="yes" --><!--# if expr="$meta_head" --><!--# echo var="meta_head" encoding="none" --><!--# else --><!--# echo var="meta_fallback" encoding="none" default="" -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Librishelf" />
    <meta property="og:title" content="Librishelf" />
    <meta property="og:description" content="Sua biblioteca pessoal, em todo lugar." />
    <meta property="og:url" content="https://librishelf.com/" />
    <meta property="og:image" content="https://librishelf.com/bookshelf.png" />
    <meta property="og:image:alt" content="Ícone de estante de livros do Librishelf" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <!--# endif -->

    <script>
      // Aplica tema, cor de destaque e idioma antes do CSS e do Vue carregarem
      // (evita piscar o tema errado). A mesma lógica vive em useTheme.js / i18n.js.
      (function () {
        var root = document.documentElement
        var accents = ['blue', 'green', 'purple', 'red', 'orange', 'yellow']
        try {
          var theme = localStorage.getItem('user-theme')
          var accent = localStorage.getItem('user-accent')
          var lang = localStorage.getItem('user-locale')
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
          }
          root.setAttribute('data-theme', theme)
          if (accents.indexOf(accent) !== -1) {
            root.style.setProperty('--main-color-rgb', 'var(--' + accent + '-rgb)')
            root.style.setProperty('--main-solid-rgb', 'var(--' + accent + '-solid-rgb)')
          }
          var bar = theme === 'light' ? '#f0f0f3' : '#121212'
          var metas = document.querySelectorAll('meta[name="theme-color"]')
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', bar)
          if (lang === 'en') root.lang = 'en'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <noscript>O Librishelf precisa de JavaScript habilitado. / Librishelf requires JavaScript.</noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
