# Resolver do Docker: resolve o nome do backend a cada requisição, então o nginx
# sobe mesmo que o backend ainda não esteja pronto (ou seja recriado).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Capas vão até 10 MB (limite do backend) + margem do multipart.
  client_max_body_size 12m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # API no mesmo domínio: /api/... → backend:3050/... (sem o prefixo).
  # Same-origin: o cookie de sessão não precisa de CORS em produção.
  location /api/ {
    set $backend http://librishelf-backend:3050;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;
  }

  # Arquivos com hash no nome gerados pelo Vite: cache longo e imutável.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # index.html sempre revalidado, para pegar o build novo após deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
