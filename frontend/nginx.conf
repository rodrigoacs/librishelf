# Resolver do Docker: resolve o nome do backend a cada requisição, então o nginx
# sobe mesmo que o backend ainda não esteja pronto (ou seja recriado).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
  listen 80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  # Capas vão até 10 MB (limite do backend) + margem do multipart.
  client_max_body_size 12m;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/wasm;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # API no mesmo domínio: /api/... → backend:3050/... (sem o prefixo).
  # Same-origin: o cookie de sessão não precisa de CORS em produção.
  location /api/ {
    set $backend http://librishelf-backend:3050;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 60s;

    # Respostas da API (capas incluídas) fora dos buscadores
    add_header X-Robots-Tag "noindex" always;
  }

  # Arquivos com hash no nome gerados pelo Vite: cache longo e imutável.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Bibliotecas públicas: o nginx monta o <head> com SSI. O index.html traz
  # comandos <!--# ... --> (comentários comuns fora daqui) que pedem ao backend
  # o trecho desta biblioteca — hoje a tag robots, conforme a opção "aparecer em
  # buscadores" na Conta. Precisa estar no HTML que sai do servidor: o Google
  # pode nem executar o JavaScript de uma página que chega com noindex.
  # Backend fora do ar, lento ou com erro: entra o noindex padrão.
  location ~ "^/u/(?<lib_user>[A-Za-z0-9._-]{1,40})/?$" {
    set $meta_fallback '<meta name="robots" content="noindex, nofollow">';
    ssi on;
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  }

  # Qualquer outra coisa em /u/ (nome inválido, subcaminho): SPA com noindex.
  location /u/ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  }

  # Subrequisição do SSI acima: /__meta/u/<nome> → backend:3050/meta/u/<nome>.
  location /__meta/ {
    internal;
    set $backend http://librishelf-backend:3050;
    rewrite ^/__meta/(.*)$ /meta/$1 break;
    proxy_pass $backend;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    # Não segura a página: sem resposta rápida, vai o noindex padrão.
    proxy_connect_timeout 2s;
    proxy_read_timeout 3s;
  }

  # index.html sempre revalidado, para pegar o build novo após deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  }

  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
