services:
  frontend:
    build:
      context: ./frontend
    container_name: librishelf-frontend
    restart: unless-stopped
    # O nginx da VPS aponta para este container (pelo nome, na rede "proxy").
    # A porta local fica só para teste na própria máquina.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - proxy

  backend:
    build:
      context: ./backend
    container_name: librishelf-backend
    restart: unless-stopped
    # Sem porta publicada: só o nginx do frontend fala com a API, em /api.
    env_file:
      - ./backend/src/.env
    environment:
      - UPLOAD_DIR=/app/uploads
      # nginx da VPS → nginx do frontend → backend
      - TRUST_PROXY=2
    volumes:
      # O container roda como o usuário "node" (uid 1000): a pasta do host
      # precisa pertencer a ele → sudo chown -R 1000:1000 ./uploads
      - ./uploads:/app/uploads
    networks:
      - proxy

networks:
  proxy:
    external: true
