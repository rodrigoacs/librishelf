# CI do Librishelf: a cada push e pull request roda os testes do backend
# (unitários e de integração, num Postgres descartável) e lint, testes e
# build do frontend. Nada é publicado daqui.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: librishelf
          POSTGRES_PASSWORD: librishelf
          POSTGRES_DB: librishelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U librishelf -d librishelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Os scripts leem src/.env.test (--env-file); o banco só aceita testes
      # destrutivos com "test" no nome e ALLOW_DESTRUCTIVE_TEST_DB=true.
      - name: Criar src/.env.test
        run: |
          cat > src/.env.test <<'ENV'
          DB_USER=librishelf
          DB_PASSWORD=librishelf
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=librishelf_test
          SECRET_KEY=ci-secret-key-only-for-tests-with-32-chars
          ALLOW_DESTRUCTIVE_TEST_DB=true
          UPLOAD_DIR=./uploads-test
          ENV

      - run: npm run db:migrate:test
      - run: npm run test:unit
      - run: npm test

  frontend:
    name: Frontend (lint, testes, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Mesma imagem do Dockerfile: erro de sintaxe no nginx aparece aqui, não no deploy
      - name: Validar a configuração do nginx
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx-security.conf:/etc/nginx/snippets/librishelf-security.conf:ro" \
            nginx:stable-alpine nginx -t

  # Ponta a ponta: imagens de produção (nginx com CSP, backend, worker) num
  # compose próprio, Mercado Pago e e-mail falsos (e2e/fakes) e o Playwright
  # em celular (Pixel, iPhone no WebKit) e desktop.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: e2e

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - name: Subir o stack de teste
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Instalar os navegadores
        run: npx playwright install --with-deps chromium webkit

      - run: npm run test:stack

      - name: Logs do stack
        if: failure()
        run: |
          mkdir -p .tmp
          docker compose logs --no-color > .tmp/stack.log 2>&1

      - name: Relatório e rastros das falhas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            e2e/.tmp/report
            e2e/.tmp/results
            e2e/.tmp/stack.log
          retention-days: 7

      - name: Derrubar o stack
        if: always()
        run: docker compose down -v
